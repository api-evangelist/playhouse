aid: playhouse
name: playhouse
description: Playhouse is a consumer real estate application that combines homes-for-sale
  listings with community polls and reactions. Home searchers, neighbors, homebuyers,
  investors, and real estate professionals browse luxury and residential listings and
  react to them, turning property discovery into a social, opinion-driven experience.
  The product ships as native iOS and Android apps backed by a private api.playhouse.so
  service; there is no publicly documented developer API, SDK, OpenAPI, or API reference
  surface. Playhouse is a 500 Global portfolio company. This profile was enriched from
  live probes of its Webflow marketing site, app-store listings, and DNS/TLS records.
